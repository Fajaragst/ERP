version: '3.8'

services:
  web:
    build: .
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    expose:
      - 8000
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createsuperuser --noinput --ignore-if-exists || true &&
             gunicorn erp.wsgi:application --bind 0.0.0.0:8000"

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    restart: always

volumes:
  postgres_data: