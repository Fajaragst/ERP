version: '3.1'
services:
  web:
    image: odoo:16.0
    ports:
      - "8069:8069"
    env_file: .env
    volumes:
      - /opt/odoo/web/data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    depends_on:
      - db
  
  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - /opt/odoo/db/data:/var/lib/postgresql/data